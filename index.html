<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Norina Shorter, enter</title>
<meta name="description" content="Norina Shorter, Family Constellations facilitator in Forest Row and online.">
<link rel="icon" href="images/norina.jpg">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&amp;family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&amp;display=swap">
<style>
body{margin:0}
a{color:#0A0A09}
a:hover{text-decoration-thickness:2px}
a:focus-visible,summary:focus-visible{outline:2px solid #0A0A09;outline-offset:3px}
.dk a:focus-visible{outline-color:#F3F2EE}
summary{list-style:none;cursor:pointer}
summary::-webkit-details-marker{display:none}
details[open] .plus{transform:rotate(45deg)}
.plus{flex:none;font-size:28px;line-height:1;font-weight:300;transition:transform .2s}
.h2{margin:0;font-family:'Jost',system-ui,sans-serif;font-weight:300;font-size:clamp(30px,4vw,46px);line-height:1.15;letter-spacing:-.005em}
.h3{margin:0 0 8px;font-family:'Jost',system-ui,sans-serif;font-weight:400;font-size:21px;line-height:1.25}
.lab{margin:0 0 20px;font-size:13px;letter-spacing:.2em;text-transform:uppercase;font-weight:500}
.card{border:1px solid #0A0A09;background:#FFFFFF}
.btn-o{display:inline-flex;align-items:center;justify-content:center;min-height:48px;border:1px solid #0A0A09;color:#0A0A09;text-decoration:none;font-weight:500;font-size:15px;letter-spacing:.04em}
.btn-o:hover{background:#0A0A09;color:#F3F2EE}
.sum{display:flex;align-items:center;justify-content:space-between;gap:24px;min-height:44px;padding:22px 0;font-family:'Jost',system-ui,sans-serif;font-size:21px;font-weight:400;line-height:1.3}
.it{font-family:'Cormorant Garamond',Georgia,serif;font-style:italic;font-weight:500}
nav a{text-decoration:none}

.enter-box{position:absolute;opacity:0;width:1px;height:1px;margin:0}
.landing{position:absolute;left:0;top:0;width:100%;height:100vh;min-height:620px;z-index:50;background:#100D0B;color:#F3F2EE;overflow:hidden;font-family:'Jost',system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;opacity:1;visibility:visible;transition:opacity 1.4s ease,visibility 0s linear 1.4s}
.enter-box:checked ~ .landing{opacity:0;visibility:hidden;pointer-events:none}
.enter-box:not(:checked) ~ .main{display:none}
.landing .fig{position:absolute;inset:0;width:100%;height:100%}
.landing .pt{transform:translate(var(--dx),var(--dy));opacity:0;animation:gather var(--du) cubic-bezier(.25,.1,.2,1) var(--d) forwards}
.landing .aura{opacity:.0;animation:lum var(--du) ease var(--d) forwards}
.landing .spark{opacity:0;animation:twinkle calc(var(--du) * 1.15) ease-in-out calc(var(--d) + var(--tw)) forwards}
@keyframes lum{0%{opacity:0}20%{opacity:1}100%{opacity:.5}}
@keyframes twinkle{0%{opacity:0;transform:scale(.7)}35%{opacity:.55;transform:scale(1)}65%{opacity:.4}100%{opacity:0}}
.landing .halo{opacity:.0;animation:breathe 7s ease-in-out infinite;animation-delay:calc(8s + var(--b))}
.landing .ln{stroke-dasharray:1;stroke-dashoffset:1;opacity:.0;animation:draw 2.6s ease-in-out var(--ld) forwards}
@keyframes gather{0%{transform:translate(var(--dx),var(--dy));opacity:0}15%{opacity:.9}100%{transform:translate(0,0);opacity:1}}
@keyframes draw{0%{stroke-dashoffset:1;opacity:.0}10%{opacity:.5}100%{stroke-dashoffset:0;opacity:.5}}
@keyframes breathe{0%,100%{opacity:.04}50%{opacity:.28}}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.landing .cap{position:relative;z-index:2;text-align:center;padding:0 24px 7vh;opacity:0;animation:rise 2.2s ease 8.5s forwards}
.landing .nm{margin:0 0 6px;font-size:15px;letter-spacing:.34em;text-transform:uppercase;font-weight:400}
.landing .sub{margin:0 0 28px;font-size:13px;letter-spacing:.18em;text-transform:uppercase;color:#B9B8B2}
.landing .go{text-decoration:none;display:inline-flex;align-items:center;justify-content:center;min-height:50px;padding:0 44px;border:1px solid #F3F2EE;color:#F3F2EE;letter-spacing:.28em;text-transform:uppercase;font-size:14px;cursor:pointer;transition:background .4s,color .4s,border-color .4s}
.landing .go:hover{background:#9C5A3C;border-color:#9C5A3C;color:#F3F2EE}
.landing .go:focus-visible{outline:2px solid #C07A52;outline-offset:4px}
@media (prefers-reduced-motion:reduce){
.landing .pt,.landing .cap{animation:none;opacity:1;transform:none}
.landing .ln{animation:none;stroke-dashoffset:0;opacity:.5}
.landing .halo{animation:none;opacity:.12}
.landing .aura{animation:none;opacity:.5}
.landing .spark{animation:none;opacity:0}
}
</style>
